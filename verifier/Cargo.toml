[package]
name = "nodebridge-verifier"
version = "0.1.0"
edition = "2021"
description = "Checks a NodeBridge job result against its committed spec"

[[bin]]
name = "nodebridge-verifier"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
